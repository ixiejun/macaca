openapi: 3.0.0
info:
  title: Greeting API
  version: 1.0.0
  description: A simple greeting API that returns personalized hello messages.

paths:
  /api/hello:
    get:
      summary: Get a greeting message
      description: Returns a greeting message, optionally personalized with a name.
      operationId: getGreeting
      parameters:
        - name: name
          in: query
          required: false
          description: Name to include in the greeting
          schema:
            type: string
      responses:
        "200":
          description: Successful greeting response
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: The greeting message
              examples:
                default:
                  value:
                    message: "Hello, World!"
                withName:
                  value:
                    message: "Hello, Alice!"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type identifier
        message:
          type: string
          description: Human-readable error description
