[package]
name = "macaca-framework"
version = "0.1.0"
edition = "2021"
description = "Agent framework for Macaca OS — Rust implementation inspired by AgentScope"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "1"

# Logging / Tracing
tracing = "0.1"

# HTTP client (for A2A)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }

# HTTP server (for A2A server)
axum = { version = "0.8", optional = true }

# Macaca ecosystem
macaca-proto = { path = "../../foundation/macaca-proto" }
macaca-context = { path = "../../services/macaca-context" }
macaca-agent = { path = "../../application/macaca-agent" }
macaca-persist = { path = "../../foundation/macaca-persist", optional = true }
macaca-sdk = { path = "../../facade/macaca-sdk", optional = true }
macaca-llm = { path = "../../services/macaca-llm", optional = true }
macaca-tools = { path = "../../services/macaca-tools", optional = true }

[features]
default = []
a2a-client = ["dep:reqwest"]
a2a-server = ["dep:axum"]
mcp-http = ["dep:reqwest"]
persist = ["dep:macaca-persist"]
# Provider-neutral feature flags for legacy HTTP chat adapters (avoid vendor id literals in cfg).
chat_completions_api = ["dep:reqwest"]
messages_api = ["dep:reqwest"]
macaca-compat = ["dep:macaca-llm", "dep:macaca-tools", "mcp-http"]
service-clients = ["dep:macaca-sdk", "dep:macaca-llm"]
full = [
    "a2a-client",
    "a2a-server",
    "mcp-http",
    "persist",
    "chat_completions_api",
    "messages_api",
    "macaca-compat",
]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
