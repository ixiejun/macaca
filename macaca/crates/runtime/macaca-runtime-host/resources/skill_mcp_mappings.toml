# Declarative skill → MCP server mappings.
#
# This file intentionally lives OUTSIDE Rust source so the OS runtime never
# branches on product names (e.g. "playwright") in control flow. Instead the
# runtime iterates this table and matches each skill's install spec against
# the declared packages / binaries.
#
# Users can override / extend via `$MACACA_HOME/skill_mcp_mappings.toml`; the
# bundled entries remain the last-resort default.
#
# Schema:
#   [[mappings]]
#   id             : string         — stable id used in the synthesized MCP
#                                     server id (e.g. "skill:<skill>:<id>")
#   match_packages : [string]       — install.package values that trigger
#                                     this mapping
#   match_bins     : [string]       — install.bins values that trigger this
#                                     mapping
#
#   [mappings.server]                 — MCP server definition produced when the
#                                     mapping matches a skill
#   transport      : "stdio"
#   command        : string
#   args           : [string]
#   lifecycle      : scope (default "session"; use "agent_session" for
#                    concurrency-sensitive stateful servers)
#   session_mode   : "stateful" | "stateless"
#   tool_prefix    : optional string
#   required_bins  : [string]       — availability probed before launch
#   enabled        : bool (default true)
#
#   [mappings.concurrency_isolation]  — optional declarative concurrency
#                                     isolation policy applied both to this
#                                     mapping's server AND to any skill-
#                                     authored mcp_servers whose `command`
#                                     contains one of `command_match`
#   command_match        : [string] — substring patterns; empty = only the
#                                     mapping's own server
#   required_args        : [string] — injected when missing
#   skip_if_any_arg_prefix : [string] — if any existing arg starts with one
#                                     of these, the policy is a no-op

[[mappings]]
id = "playwright"
match_packages = ["@playwright/mcp"]
match_bins = ["playwright-mcp"]

[mappings.server]
transport = "stdio"
command = "playwright-mcp"
args = ["--headless"]
lifecycle = "agent_session"
session_mode = "stateful"
required_bins = ["playwright-mcp"]
enabled = true

[mappings.concurrency_isolation]
command_match = ["playwright"]
required_args = ["--isolated"]
skip_if_any_arg_prefix = ["--user-data-dir", "--isolated"]

[[mappings]]
id = "figma"
match_packages = ["figma-developer-mcp"]
match_bins = ["figma-developer-mcp"]

[mappings.server]
transport = "stdio"
command = "npx"
args = ["-y", "figma-developer-mcp", "--stdio"]
lifecycle = "agent_session"
session_mode = "stateful"
required_bins = ["npx"]
enabled = true
