[package]
name = "macaca-sdk"
version.workspace = true
edition.workspace = true

[features]
default = []
domain-pack-finance = ["dep:macaca-domain-pack-finance"]

[dependencies]
macaca-proto = { workspace = true }
macaca-agent = { workspace = true }
macaca-llm = { workspace = true }
macaca-memory = { workspace = true }
macaca-context = { workspace = true }
macaca-driver = { workspace = true }
macaca-tools = { workspace = true }
macaca-task = { workspace = true }
macaca-autonomy-evolution = { workspace = true }
macaca-skill = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
toml = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
macaca-kernel = { workspace = true }
macaca-framework = { path = "../../runtime/macaca-framework", features = ["macaca-compat", "service-clients"] }
macaca-domain-pack-finance = { workspace = true, optional = true }
[dev-dependencies]
tempfile = "3"
