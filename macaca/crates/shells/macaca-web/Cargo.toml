[package]
name = "macaca-web"
version.workspace = true
edition.workspace = true

[features]
default = ["domain-pack-finance"]
domain-pack-finance = ["dep:macaca-domain-pack-finance"]

[dependencies]
macaca-proto = { workspace = true }
macaca-app = { workspace = true }
macaca-domain-pack-finance = { workspace = true, optional = true }
macaca-sdk = { workspace = true }
macaca-runtime-host = { workspace = true }
macaca-framework = { path = "../../runtime/macaca-framework", features = ["macaca-compat", "service-clients"] }
async-trait = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tokio = { workspace = true }
futures = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
dirs = "5"
chrono = { workspace = true }
async-stream = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
once_cell = "1"
prometheus = "0.13"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
