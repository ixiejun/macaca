name: fullstack-autodev
version: "0.1.0"
description: "Fullstack Auto Development - AI-powered fullstack development with intelligent task routing, architecture-first planning, and coordinated multi-agent workflows"
layer: L3Declarative
ui_type: chat

llm_config:
  provider: volces
  model: kimi-k2.5

# Application entrypoint - coordinator receives all user messages
entry_agent: coordinator
entrypoint:
  type: workflow
  name: smart-router

# Pause chat main-thread execution after goal creation until goal lifecycle resumes.
# serde_yaml requires YAML tags for externally tagged enum variants.
execution_control:
  mode: Enabled
  triggers:
    - !ToolCallBarrier
      tool_name: create_goal
  resume_sources:
    - !GoalLifecycle
  checkpoint_mode: ReferenceOnly
  allow_command_overrides: false

# Workflow definitions
workflows:
  # Main intelligent routing workflow
  smart-router:
    description: Smart task routing - analyzes user intent and routes to appropriate workflow
    steps:
      - name: classify
        agent: coordinator
        prompt_template: workflows/classify-task.md

  # SDD workflow for complex features
  sdd:
    description: Spec-Driven Development for complex features requiring planning
    steps:
      - name: analyze
        agent: architect
        prompt_template: workflows/sdd-analyze.md
      - name: spec
        agent: architect
        prompt_template: workflows/sdd-spec.md
        depends_on: [analyze]
      - name: implement
        agent: frontend
        prompt_template: workflows/sdd-implement.md
        depends_on: [spec]

  # Direct coding workflow for simple tasks
  direct-code:
    description: Direct coding for bug fixes and simple tasks
    steps:
      - name: execute
        agent: coordinator
        prompt_template: workflows/direct-code.md

  # Chat workflow for conversations
  chat:
    description: General conversation and assistance
    steps:
      - name: respond
        agent: coordinator
        prompt_template: workflows/chat.md

# Resource paths
resources:
  personas: personas/
  skills: skills/
  prompts: prompts/
  workflows: workflows/

agents:
  # Coordinator Agent — Intelligent task router and executor
  # Acts as the main entry point, classifies tasks and routes appropriately
  - name: coordinator
    capabilities:
      - name: todo_goal_management
        description: Create and track project goals at the orchestration boundary
      - name: task_classification
        description: Classify user intent into chat, simple-code, or sdd-workflow
      - name: direct_execution
        description: Execute simple coding tasks directly without SDD overhead
      - name: conversation
        description: Engage in helpful technical conversations
    prompt_template: ""
    model: kimi-k2.5
    permission_level: system
    allowed_tools:
      - claude_code_execute
      - claude_code_resume
      - claude_code_status
      - file_read
      - file_write
      - shell
    persona_dir: "./personas/coordinator"

  # Architect Agent — architecture and interface design handoff
  # Invoked when workers need clear technical boundaries before coding
  - name: architect
    capabilities:
      - name: todo_execution
        description: Execute assigned architecture tasks and submit review summaries
      - name: architecture_design
        description: Define system boundaries, module responsibilities, and technical constraints
      - name: interface_contract_design
        description: Define frontend/backend API and data contracts
      - name: technical_risk_analysis
        description: Identify integration risks, edge cases, and rollout constraints
    prompt_template: ""
    model: kimi-k2.5
    permission_level: system
    allowed_tools:
      - file_read
      - file_write
      - figma-mcp
    persona_dir: "./personas/architect"

  # Frontend Agent — implements web UI
  - name: frontend
    capabilities:
      - name: todo_execution
        description: Execute assigned TaskBoard todos and submit review summaries
      - name: frontend_development
        description: Implement web UI with Next.js, React, TypeScript, Tailwind CSS
    prompt_template: ""
    model: kimi-k2.5
    permission_level: user
    allowed_tools:
      - claude_code_execute
      - claude_code_resume
      - opencode_execute
      - opencode_resume
      - opencode_status
      - shadcn-ui
    persona_dir: "./personas/frontend"

  # Planner Agent — decomposes goals, assigns tasks, reviews quality
  - name: planner
    capabilities:
      - name: todo_planning
        description: Manage todo decomposition and review via planning tools
      - name: task_planning
        description: Decompose goals into tasks, assign to agents, review quality
    prompt_template: ""
    model: kimi-k2.5
    permission_level: system
    allowed_tools:
      - claude_code_execute
      - claude_code_resume
    persona_dir: "./personas/planner"

  # Backend Agent — implements APIs
  - name: backend
    capabilities:
      - name: todo_execution
        description: Execute assigned TaskBoard todos and submit review summaries
      - name: backend_development
        description: Implement Go REST API with PostgreSQL
    prompt_template: ""
    model: kimi-k2.5
    permission_level: user
    allowed_tools:
      - claude_code_execute
      - claude_code_resume
      - opencode_execute
      - opencode_resume
      - opencode_status
      - golang
    persona_dir: "./personas/backend"
