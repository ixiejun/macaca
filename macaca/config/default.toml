[kernel]
max_agents = 16
heartbeat_interval_ms = 5000
agent_timeout_ms = 30000

[llm]
default_provider = "deepseek"
max_tokens_per_request = 8192
rate_limit_rpm = 600

[llm.providers.openai]
api_key = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"

[llm.providers.anthropic]
api_key = "ANTHROPIC_API_KEY"
base_url = "https://api.anthropic.com"

[llm.providers.dashscope]
api_key = "DASHSCOPE_API_KEY"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
default_model = "qwen3-max"

# Example: OpenAI-compatible providers (uncomment to enable)
[llm.providers.deepseek]
api_key = "sk-4b129238651244dda62bc83562ffcb15"
base_url = "https://api.deepseek.com/v1"
default_model = "deepseek-v4-flash"

[llm.providers.zai]
api_key = "ZHIPU_API_KEY"
base_url = "https://open.bigmodel.cn/api/paas/v4"
default_model = "glm-5"

# MiniMax：OpenAI 兼容端点 https://api.minimaxi.com/v1
# api_key_plan = Token Plan / 订阅（Coding Plan）密钥，优先使用
# api_key = 按量计费密钥；全大写则为环境变量名。仅当 api_key_plan 为空时才用 api_key
[llm.providers.minimax]
api_key_plan = "sk-cp-CS_HBIo2UdWWEfOh737IoTGaudHBSiln1xFirTmCH4AodCN9SLU0iA9I8TKJ8Lv16536v3m0d0GTAhnTcRzxfj5ldU9CUE8wMgaF9QwPLMQ3LgL-_zW52o8"
api_key = ""
base_url = "https://api.minimaxi.com/v1"
default_model = "MiniMax-M2.7"

[llm.providers.volces]
api_key_plan = "c91590fd-77bc-4c06-bca2-4ce9f1f2ae0b"
api_key = ""
base_url = "https://ark.cn-beijing.volces.com/api/coding/v3"
default_model = "kimi-k2.5"

# OpenRouter: AI model aggregation platform
# Supports 100+ models from various providers via OpenAI-compatible API.
# Model format: "provider/model-name" (e.g. "qwen/qwen3.6-plus:free")
# Get API key at https://openrouter.ai/keys
[llm.providers.openrouter]
api_key = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
default_model = "qwen/qwen3.6-plus:free"

# [llm.providers.ollama]
# api_key = ""
# base_url = "http://localhost:11434/v1"

[memory]
session_ttl_seconds = 3600
file_store_path = "./data/memory/files"
auto_retrieve_on = "task_start"

[memory.vector]
backend = "milvus"
milvus_url = "http://localhost:19530"
collection_name = "agent_memory"

[memory.embedding]
provider = "dashscope"
model = "text-embedding-v4"
api_key = "DASHSCOPE_API_KEY"
dimensions = 1024
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

[memory.compression]
enabled = true
threshold_entries = 100
strategy = "llm_summarize"

[ipc]
nats_url = "nats://localhost:4222"
nats_auto_start = true
reconnect_max_attempts = 10
reconnect_delay_ms = 1000

[workspace]
root_dir = "/Users/quantum/.macaca/workspaces"

[drivers]
# External driver plugin directory — located under macaca workspaces root
directory = "/Users/quantum/.macaca/workspaces/drivers"
# Whether to auto-load all drivers at startup
auto_load = true

[persist]
engine = "redb"
data_dir = "./data/persist"
snapshot_interval_seconds = 300

[gateway]
enabled = true

[gateway.telegram]
enabled = true
bot_token_env = "TELEGRAM_BOT_TOKEN"
allowed_user_ids = []

[gateway.discord]
enabled = true
bot_token_env = "DISCORD_BOT_TOKEN"
command_prefix = "!"

[observability]
log_level = "debug"
tracing_enabled = true
otlp_endpoint = ""

# File logging configuration
[observability.log_file]
enabled = true
dir = "./logs"
prefix = "macaca"
format = "json"
retention_days = 10
compress = true

# ---------------------------------------------------------------------------
# MCP (Model Context Protocol) runtime configuration
# ---------------------------------------------------------------------------
#
# `[mcp.env]` — key/value pairs re-exported into the backend process
# environment at startup so every stdio MCP child process inherits them
# automatically (via tokio::process::Command default env inheritance).
#
# Value semantics:
#   - A literal secret  → forwarded verbatim, e.g. `FIGMA_API_KEY = "figd_xxx"`
#   - An ALL_CAPS identifier → treated as the name of an EXISTING shell env
#     variable to forward, e.g. `FIGMA_API_KEY = "FIGMA_API_KEY"` only takes
#     effect if you `export FIGMA_API_KEY=figd_xxx` before launching.
#   - A placeholder starting with `YOUR_`, `REPLACE_`, or wrapped in `<...>`
#     → skipped with an INFO log. Safe to commit placeholders to the repo.
#
# Replace the placeholder below with your Figma Personal Access Token before
# starting the backend. Do NOT commit real tokens.
[mcp.env]
FIGMA_API_KEY = "figd_DP_td8sx285ub8u2nVClYoOfavmFsTNwd0oHQtpr"

# ---------------------------------------------------------------------------
# Context engine + composer (macaca-proto `ContextConfig`)
# ---------------------------------------------------------------------------
# Loads OpenClaw-style profile Markdown via `ProfileFileContextProvider` into the composer.
# - `persona_directory`: `{app_dir}/personas/{agent_name}` (same tree as IDENTITY.md / TOOLS.md)
# - `agent_private_workspace`: `{data_dir}/workspaces/{app_id}/agents/{agent_name}`
[context.agent_profile]
enabled = true
root_kind = "persona_directory"
# Per-file byte budget before truncation (optional; default is 2 MiB)
# max_file_bytes = 2097152
# include HEARTBEAT.md / MEMORY.md seed (defaults: true / true)
# inject_heartbeat = true
# include_memory_seed = true
