# OpenRouter: AI model aggregation platform
# Supports 100+ models from various providers via OpenAI-compatible API.
# Model format: "provider/model-name" (e.g. "qwen/qwen3.6-plus:free")
# Get API key at https://openrouter.ai/keys
[llm.providers.openrouter]
api_key = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
default_model = "qwen/qwen3.6-plus:free"

# [llm.providers.ollama]
# api_key = ""
# base_url = "http://localhost:11434/v1"

[memory]
session_ttl_seconds = 3600
file_store_path = "./data/memory/files"
auto_retrieve_on = "task_start"

[memory.vector]
backend = "milvus"
milvus_url = "http://localhost:19530"
collection_name = "agent_memory"

[memory.embedding]
provider = "dashscope"
model = "text-embedding-v4"
api_key = "sk-7720115f25214ebaa4f83d5857224f9a"
dimensions = 1024
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

[memory.compression]
enabled = true
threshold_entries = 100
strategy = "llm_summarize"

[ipc]
nats_url = "nats://localhost:4222"
nats_auto_start = true
reconnect_max_attempts = 10
reconnect_delay_ms = 1000

[workspace]
root_dir = "/Users/quantum/.macaca/workspaces"

[drivers]
# External driver plugin directory — located under macaca workspaces root
directory = "/Users/quantum/.macaca/workspaces/drivers"
# Whether to auto-load all drivers at startup
auto_load = true

[persist]
engine = "redb"
data_dir = "./data/persist"
snapshot_interval_seconds = 300

[gateway]
enabled = true

[gateway.telegram]
enabled = true
bot_token_env = "TELEGRAM_BOT_TOKEN"
allowed_user_ids = []

[gateway.discord]
enabled = true
bot_token_env = "DISCORD_BOT_TOKEN"
command_prefix = "!"

[observability]
log_level = "debug"
tracing_enabled = true
otlp_endpoint = ""

# File logging configuration
[observability.log_file]
enabled = true
dir = "./logs"
prefix = "macaca"
format = "json"
retention_days = 10
compress = true

# ---------------------------------------------------------------------------
# Autonomy runtime
# ---------------------------------------------------------------------------
#
# Explicitly activate the local Scheduler + Heartbeat providers and the
# runtime-host-owned supervisor. Rust defaults remain fail-closed; this file is
# the operator-level opt-in used by the local Macaca web host.
[autonomy]
provider_mode = "local"
supervisor_enabled = true
scheduler_tick_interval_ms = 5000
heartbeat_tick_interval_ms = 5000
max_leases_per_tick = 8
dispatch_timeout_ms = 30000
shutdown_grace_ms = 5000
recovery_wake_enabled = true
safe_retention_limit = 128

# ---------------------------------------------------------------------------
# MCP (Model Context Protocol) runtime configuration
# ---------------------------------------------------------------------------
#
# `[mcp.env]` — key/value pairs re-exported into the backend process
# environment at startup so every stdio MCP child process inherits them
# automatically (via tokio::process::Command default env inheritance).
#
# Value semantics:
#   - A literal secret  → forwarded verbatim, e.g. `FIGMA_API_KEY = "figd_xxx"`
#   - An ALL_CAPS identifier → treated as the name of an EXISTING shell env
#     variable to forward, e.g. `FIGMA_API_KEY = "FIGMA_API_KEY"` only takes
#     effect if you `export FIGMA_API_KEY=figd_xxx` before launching.
#   - A placeholder starting with `YOUR_`, `REPLACE_`, or wrapped in `<...>`
#     → skipped with an INFO log. Safe to commit placeholders to the repo.
#
# Replace the placeholder below with your Figma Personal Access Token before
# starting the backend. Do NOT commit real tokens.
[mcp.env]
FIGMA_API_KEY = "figd_DP_td8sx285ub8u2nVClYoOfavmFsTNwd0oHQtpr"

# ---------------------------------------------------------------------------
# Context engine + composer (macaca-proto `ContextConfig`)
# ---------------------------------------------------------------------------
[context]
# Use the composer-aware builtin engine by default in local runs so configured
# providers such as active vector memory recall execute before model calls.
# Keep legacy as the fallback for conservative degradation.
default_engine = "windowed"
fallback_engine = "legacy"

[context.recall]
# Start the local workspace Memory Service so active vector memory has a real
# retrieval backend. This exposes memory tools but leaves legacy preflight
# recall disabled; active recall remains owned by the composer provider below.
expose_memory_tools = true

# Enable composer-stage active vector memory recall for the local Macaca web
# host. The recall provider stays application-neutral: it reads only scoped
# workspace memory through the SystemMemoryClient before each model call, and
# the composer treats recalled rows as dynamic, untrusted, request-only context.
[context.active_vector_memory]
enabled = true
include_agent_private = true
include_session_shared = true
timeout_ms = 5000
max_query_tokens = 2048
max_hits = 8
max_chars = 4000
max_tokens = 1000

# Loads OpenClaw-style profile Markdown via `ProfileFileContextProvider` into the composer.
# - `persona_directory`: `{app_dir}/personas/{agent_name}` (same tree as IDENTITY.md / TOOLS.md)
# - `agent_private_workspace`: `{data_dir}/workspaces/{app_id}/agents/{agent_name}`
[context.agent_profile]
enabled = true
root_kind = "persona_directory"
# Per-file byte budget before truncation (optional; default is 2 MiB)
# max_file_bytes = 2097152
# include HEARTBEAT.md / MEMORY.md seed (defaults: true / true)
# inject_heartbeat = true
# include_memory_seed = true

# External context adapters are installed into the engine registry at startup.
# They can then be selected through:
# - [context].default_engine
# - app manifest context.engine
# - agent-level context_engine override
#
# `http_json` contract:
# - request body  = serialized macaca_context::ContextAssembleInput
# - response body = serialized macaca_context::ContextAssembleResult
#
# Header values follow the same convention as other config sections:
# - literal strings are used verbatim
# - ALL_CAPS identifiers are resolved from process env at startup
#
# [[context.external_adapters]]
# id = "workspace-sidecar"
# display_name = "Workspace Context Sidecar"
# version = "1.0.0"
# enabled = false
# transport = "http_json"
#
# [context.external_adapters.http_json]
# url = "http://127.0.0.1:8787/assemble"
# headers = { AUTHORIZATION = "EXTERNAL_CONTEXT_BEARER" }
#
# [context.external_adapters.safety]
# timeout_ms = 2000
# max_payload_bytes = 262144
# require_schema_validation = true
# require_budget_validation = true
# circuit_breaker_failures = 3
#
# [context.external_adapters.fallback]
# fallback_engine_id = "legacy"
# empty_external_contribution = true
